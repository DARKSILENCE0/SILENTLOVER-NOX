<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_name }}</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <header>
        <div class="logo">SILENTLOVER</div>
        <div class="subtitle">OSINT INTELLIGENCE TOOL</div>
    </header>

    <main>

        <section class="hero">
            <h1>Public Intelligence Search</h1>

            <p>
                Search publicly available information about a username,
                email, IP address or domain.
            </p>

            <div class="search-box">

                <input
                    id="target"
                    type="text"
                    placeholder="username, email, IP or domain"
                    autocomplete="off"
                >

                <button onclick="startScan()">
                    SCAN
                </button>

            </div>

            <div id="status"></div>

        </section>


        <section id="results" class="results hidden">

            <h2>SCAN RESULTS</h2>

            <div id="result-content"></div>

        </section>

    </main>


    <footer>
        POWERED BY SILENTLOVER ❤️
    </footer>

</div>

<script src="/static/app.js"></script>

</body>
</html>

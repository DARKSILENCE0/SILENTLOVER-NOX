<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SILENTLOVER NOX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #030303;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 6px;
        }

        .subtitle {
            margin-top: 10px;
            color: #777;
            letter-spacing: 4px;
            font-size: 12px;
        }

        .description {
            margin: 40px auto 25px;
            max-width: 600px;
            color: #888;
            line-height: 1.6;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 18px;
            background: #0d0d0d;
            color: white;
            border: 1px solid #292929;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #777;
        }

        button {
            padding: 18px 30px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            margin-top: 20px;
            color: #777;
        }

        #results {
            margin-top: 25px;
            text-align: left;
        }

        .result {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 18px;
            margin-top: 10px;
            border-radius: 10px;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 60px;
            color: #555;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 28px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        SILENTLOVER NOX
    </div>

    <div class="subtitle">
        DEEP OSINT INTELLIGENCE PLATFORM
    </div>

    <p class="description">
        Public-source intelligence and digital footprint analysis platform.
        Enter a target to begin reconnaissance.
    </p>

    <div class="search-box">
        <input
            id="target"
            type="text"
            placeholder="Enter username, email, IP or domain..."
        >

        <button onclick="startScan()">
            SCAN
        </button>
    </div>

    <div id="status"></div>

    <div id="results" class="hidden"></div>

    <footer>
        POWERED BY SILENTLOVER ❤️
    </footer>

</div>

<script>
async function startScan() {

    const target = document
        .getElementById("target")
        .value
        .trim();

    const status = document.getElementById("status");
    const results = document.getElementById("results");

    if (!target) {
        status.textContent = "Enter a target first.";
        return;
    }

    status.textContent = "Scanning...";
    results.classList.add("hidden");
    results.innerHTML = "";

    try {

        const response = await fetch("/api/scan", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                target: target
            })
        });

        const data = await response.json();

        if (!data.success) {
            status.textContent = data.error;
            return;
        }

        status.textContent =
            "Target type: " + data.type;

        data.results.forEach(item => {

            const div = document.createElement("div");

            div.className = "result";

            div.innerHTML = `
                <strong>${escapeHtml(item.module)}</strong>
                <br><br>
                ${escapeHtml(item.data)}
            `;

            results.appendChild(div);
        });

        results.classList.remove("hidden");

    } catch (error) {

        status.textContent =
            "Server connection failed.";
    }
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
